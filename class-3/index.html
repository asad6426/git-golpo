<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>গিটের গল্প: ক্লাস ৩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a Dhaka rickshaw-painted comic. Summary map first, then one chapter at a time:
   story panel -> why -> commands -> working terminal -> quiz. */
:root{
  --bg:#EAF5F2; --paper:#FFFFFF; --soft:#D5EBE6; --ink:#1B1A3D; --mute:#55587A; --line:#1B1A3D;
  --pink:#CF1F6B; --teal:#0B7F7B; --sun:#F4B400; --sky:#BFE6EE; --orange:#E8622A; --good:#0A8A4A; --bad:#C92A2A;
  --pinktint:#FBE3EE; --suntint:#FFF3CC; --tealtint:#D6F0EE;
  --term:#14132E; --termfg:#E9E8F8; --termdim:#8C8BB0; --termr:#FF6B7A; --termg:#5BE09A; --termy:#FFD25E; --termb:#7DB6FF; --termc:#6CE3DF; --termm:#FFB3D3;
  --display:"Galada","Hind Siliguri",serif; --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif; --mono:"JetBrains Mono","Hind Siliguri",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151433; --paper:#211F47; --soft:#2C2A58; --ink:#F3F2FF; --mute:#B4B3D6; --line:#0B0A20;
  --pink:#FF5C9E; --teal:#3ED0C8; --sun:#FFC933; --sky:#2B4F70; --orange:#FF8A52; --good:#49D88E; --bad:#FF7272;
  --pinktint:#45193B; --suntint:#44391A; --tealtint:#143F45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151433; --paper:#211F47; --soft:#2C2A58; --ink:#F3F2FF; --mute:#B4B3D6; --line:#0B0A20;
  --pink:#FF5C9E; --teal:#3ED0C8; --sun:#FFC933; --sky:#2B4F70; --orange:#FF8A52; --good:#49D88E; --bad:#FF7272;
  --pinktint:#45193B; --suntint:#44391A; --tealtint:#143F45; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1020px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(46px,9vw,84px);color:var(--pink)}
h2{font-size:clamp(32px,5.5vw,48px)}
h3{font-size:27px;color:var(--teal)}
p{margin:0;max-width:68ch}
code,.mono{font-family:var(--mono);font-size:.88em}
a{color:var(--teal);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;gap:12px;align-items:center;padding-block:10px;border-bottom:3px solid var(--ink);margin-bottom:22px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:25px;color:var(--pink);background:none;border:0;padding:0;line-height:1}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:200px}
.dot{width:29px;height:29px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0;line-height:1}
.dot.done{background:var(--good);color:#fff}
.dot.on{background:var(--sun);color:#1B1A3D}
.meter{font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}

/* zigzag ribbon: rickshaw panel border */
.zig{height:14px;background:linear-gradient(135deg,var(--pink) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(225deg,var(--pink) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(315deg,var(--sun) 25%,transparent 25%) 0 0/14px 14px,linear-gradient(45deg,var(--sun) 25%,var(--teal) 25%) 0 0/14px 14px}

/* hero */
.hero{display:grid;gap:14px;margin-bottom:26px}
.lead{font-size:20px;max-width:60ch}
.how{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;font-size:15px}
.how span{background:var(--paper);border:2px solid var(--ink);padding:3px 11px;border-radius:999px}
.how i{font-style:normal;color:var(--pink)}
.cta{background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 22px;border-radius:10px;font-weight:700;font-size:18px;justify-self:start}
:root[data-theme="dark"] .cta{color:#1B1A3D}
.cta:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
section.block{margin-block:30px;display:grid;gap:14px}
.route{display:grid;gap:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.rt{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;background:none;border:0;border-bottom:2px dashed var(--soft);text-align:left;align-items:start;width:100%}
.rt:last-child{border-bottom:0}
.rt:hover{background:var(--suntint)}
.rt .n{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--ink)}
.rt.done .n{background:var(--good)}
.rt b{font-size:18px}
.rt small{color:var(--mute);display:block;font-size:14.5px;line-height:1.45}
.rt .ts{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-family:var(--mono);font-size:12.5px;background:var(--tealtint);padding:0 7px;border-radius:5px;line-height:1.7}
.tbl{overflow-x:auto;border:3px solid var(--ink);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15.5px}
th{background:var(--ink);color:var(--bg);text-align:left;padding:7px 10px;font-weight:600}
td{padding:7px 10px;border-top:1px solid var(--soft);vertical-align:top}
td code{white-space:nowrap;color:var(--pink);font-weight:600}
tr.grp td{background:var(--suntint);font-weight:700}
.style-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.style-list div{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:11px 14px}
.style-list b{display:block;color:var(--pink)}

/* chapter */
.chap-head{display:grid;gap:6px;margin-bottom:14px}
.eyebrow{font-weight:600;color:var(--mute);font-size:15px}
.eyebrow .mono{background:var(--suntint);padding:1px 7px;border-radius:5px;color:var(--ink)}
.part{margin-block:28px;display:grid;gap:12px}
.part>h3{display:flex;gap:9px;align-items:baseline}

/* stage */
.stage-box{border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:6px 6px 0 var(--ink)}
svg.stage{display:block;width:100%;height:auto;background:var(--sky)}
.stage text{font-family:var(--body);fill:#1B1A3D;font-weight:600}
.actor{transition:transform .8s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.actor.hide{opacity:0}
.talk .inner{animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.led{fill:#2FD27F;animation:led 1.2s steps(2) infinite}
.down .led{fill:#FF3B3B;animation-duration:.35s}
@keyframes led{50%{opacity:.35}}
.ring{animation:ring .25s linear infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bad .paper{fill:#FFC7C7}.good .paper{fill:#BDF2D2}.gold .paper{fill:#FFE28A}
.bubble{padding:13px 16px;min-height:92px;border-top:4px solid var(--ink);display:grid;gap:2px;align-content:start}
.bubble b{color:var(--pink);font-size:15px}
.bubble p{font-size:18px}
.scene-ctl{display:flex;gap:8px;align-items:center;padding:0 16px 13px;flex-wrap:wrap}
.btn{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:3px 13px;font-weight:600;font-size:15px}
.btn:hover:not(:disabled){background:var(--suntint)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--sun);color:#1B1A3D}
.count{font-size:14px;color:var(--mute);margin-left:auto;font-variant-numeric:tabular-nums}
details.all{padding:0 16px 12px;font-size:15.5px}
details.all summary{cursor:pointer;color:var(--mute);font-weight:600}
details.all ol{margin:6px 0 0;padding-left:22px}

.duo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 15px;min-width:0}
.card.pink{background:var(--pinktint)}.card.sun{background:var(--suntint)}.card.teal{background:var(--tealtint)}
.card h4{margin:0 0 3px;font-size:17.5px;font-weight:700}
.card ul{margin:0;padding-left:20px}
.card p+p{margin-top:6px}
.note{border-left:0;background:var(--suntint);border:2px dashed var(--ink);border-radius:10px;padding:9px 14px;font-size:15.5px}
.cmdlist{display:grid;gap:8px}
.cmd{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:4px 14px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:9px 13px}
.cmd code{color:var(--pink);font-weight:600;overflow-wrap:anywhere;font-size:14.5px}
.cmd span{font-size:15.5px}
@media (max-width:640px){.cmd{grid-template-columns:minmax(0,1fr)}}

/* terminal */
.lab{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 290px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:minmax(0,1fr)}.lab .miss{order:-1}}
.term{background:var(--term);color:var(--termfg);border-radius:12px;border:3px solid var(--ink);overflow:hidden;font-family:var(--mono);font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;min-width:0;position:relative}
.term-bar{display:flex;align-items:center;gap:7px;padding:5px 10px;background:#25234C;color:#C9C8E8;font-size:12px}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--pink);display:block}
.term-bar i+i{background:#F4B400}.term-bar i+i+i{background:#2FD27F}
.term-bar button{margin-left:auto;background:none;border:1px solid #6A69A0;color:#E9E8F8;border-radius:5px;padding:0 8px;font-size:12px}
.t-out{height:330px;overflow:auto;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere}
.t-line{display:flex;gap:7px;padding:6px 11px 8px;border-top:1px solid #33315E;align-items:baseline;flex-wrap:wrap}
.t-line label{color:var(--termg);font-weight:600;white-space:nowrap;overflow-wrap:anywhere}
.t-line input{flex:1;min-width:120px;background:none;border:0;color:var(--termfg);font:inherit;outline:0;caret-color:var(--termg)}
.pr{color:var(--termg);font-weight:600}.r{color:var(--termr)}.g{color:var(--termg)}.y{color:var(--termy)}.b{color:var(--termb);font-weight:600}.c{color:var(--termc)}.dim{color:var(--termdim)}
.m{color:var(--termm);font-family:var(--body);font-size:14.5px;display:block;margin-block:2px}
.editor{position:absolute;inset:0;background:var(--term);display:flex;flex-direction:column;z-index:2}
.editor .ehead{padding:3px 10px;background:#E9E8F8;color:#14132E;font-size:12.5px;overflow-wrap:anywhere}
.editor textarea{flex:1;background:none;border:0;color:var(--termfg);font:inherit;padding:8px 10px;resize:none;outline:0;min-height:160px}
.editor textarea.normal{caret-color:transparent}
.ehelp{font-family:var(--body);font-size:13.5px;padding:3px 10px;color:var(--termm)}
.ebar{display:flex;gap:6px;padding:6px 10px;align-items:center;flex-wrap:wrap;border-top:1px solid #33315E}
.ebar button{background:#2C2A58;color:#E9E8F8;border:1px solid #6A69A0;border-radius:5px;padding:1px 9px;font-size:12.5px;font-family:var(--mono)}
.ebar .mode{font-weight:600;color:var(--termy)}
.ebar input{background:none;border:0;border-bottom:1px solid #6A69A0;color:var(--termfg);font:inherit;width:90px;outline:0}
.miss{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:11px 12px;display:grid;gap:6px;min-width:0}
.miss h4{margin:0;font-size:17px}
.miss ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.miss li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px;font-size:14.8px;line-height:1.4;opacity:.5}
.miss li.cur{opacity:1;background:var(--suntint);margin-inline:-5px;padding:5px;border-radius:7px}
.miss li.ok{opacity:1}
.miss li.ok .tick{background:var(--good);color:#fff;animation:pop .35s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}}
.tick{width:21px;height:21px;border-radius:50%;border:2px solid var(--ink);font-size:12px;display:grid;place-items:center;font-weight:700}
.hintbtn{font-size:12.5px;background:none;border:0;padding:0;color:var(--teal);font-weight:700;text-decoration:underline;display:block;text-align:left;overflow-wrap:anywhere}
.hintcmd{font-family:var(--mono);font-size:12.5px;display:block;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:5px;padding:2px 7px;margin-top:3px;overflow-wrap:anywhere;width:100%}
.win{background:var(--tealtint);border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-weight:600;font-size:15px}

/* four zones */
.zones-wrap{position:relative;margin-top:2px}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
@media (max-width:640px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zone{border:3px solid var(--ink);border-radius:10px;background:var(--paper);min-height:128px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.zone h5{margin:0;font-size:14px;font-weight:700;line-height:1.25}
.zone small{font-size:11.5px;color:var(--mute);line-height:1.25}
.z1 h5{color:var(--bad)}.z2 h5{color:var(--good)}.z3 h5{color:var(--teal)}.z4 h5{color:var(--orange)}
.fc{font-family:var(--mono);font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--soft);overflow-wrap:anywhere;line-height:1.45}
.fc.red{background:var(--bad);color:#fff}.fc.grn{background:var(--good);color:#fff}
.flyer{position:absolute;z-index:3;font-family:var(--mono);font-size:12px;background:var(--sun);color:#1B1A3D;border:2px solid #1B1A3D;border-radius:6px;padding:0 7px;transition:left .75s cubic-bezier(.4,0,.2,1),top .75s cubic-bezier(.4,0,.2,1),opacity .2s .65s;pointer-events:none;white-space:nowrap}
.graph{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:4px;margin-top:8px}
.graph text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
.graph .msg{fill:var(--mute);font-size:10px;font-family:var(--body)}

/* quiz */
.quiz{display:grid;gap:12px}
.q{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:11px 14px;display:grid;gap:7px}
.q p{font-weight:600}
.opts{display:grid;gap:5px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:4px 11px;font-size:15.5px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){background:var(--suntint)}
.opt.yes{background:var(--good);color:#fff}.opt.no{background:var(--bad);color:#fff;text-decoration:line-through}
.exp{font-size:15px;background:var(--tealtint);border-radius:7px;padding:5px 10px}
.foot-nav{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}

/* widgets */
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tab{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 11px;font-weight:600;font-size:15px}
.tab.on{background:var(--ink);color:var(--bg)}
.dns{font-family:var(--mono);font-size:13.5px;background:var(--term);color:var(--termfg);border-radius:9px;padding:9px 12px;overflow-x:auto;white-space:pre;line-height:1.55}
.dns .add{background:#16523A;color:#CFFFE4;display:inline-block;min-width:100%}.dns .del{background:#5C1E2E;color:#FFD6DE;display:inline-block;min-width:100%}
input[type=range]{width:100%;accent-color:var(--pink)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;font-size:15.5px}
.meta b{color:var(--mute);font-weight:500}
.dl{font-family:var(--mono);font-size:13.5px;background:var(--term);color:var(--termfg);border-radius:9px;padding:6px;display:grid}
.dl button{all:unset;cursor:pointer;padding:1px 7px;border-radius:4px;overflow-wrap:anywhere}
.dl button:hover,.dl button.on{background:#38366B}
.dl button:focus-visible{outline:2px solid var(--pink)}
.files{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));margin-bottom:8px}
.files button{font-family:var(--mono);font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:7px;padding:2px 6px}
.files button.on{background:var(--sun);color:#1B1A3D}
.seq{overflow-x:auto;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px}
.seq svg{display:block;width:100%;min-width:560px;height:auto}
.seq text{font-family:var(--body);font-weight:600}
.ign{display:grid;gap:4px}
.ign div{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:13.5px;background:var(--bg);border-radius:6px;padding:2px 9px;flex-wrap:wrap}
.tagy{color:var(--bad);font-family:var(--body);font-weight:700}.tagn{color:var(--good);font-family:var(--body);font-weight:700}
input.txt{font:inherit;font-family:var(--mono);font-size:14px;padding:4px 9px;border:2px solid var(--ink);border-radius:7px;background:var(--paper);color:var(--ink);width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="home">গিটের গল্প</button>
    <div class="dots" id="dots"></div>
    <div class="meter" id="meter"></div><a href="https://asad6426.github.io/git-golpo/" style="margin-left:auto;padding:3px 12px;border:2px solid var(--ink);border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:600">সব ক্লাস</a>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";
/* ============ tiny helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const h=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function sha1(str){
  const b=new TextEncoder().encode(str),l=b.length,w=new Uint32Array(((l+8>>6)+1)*16);
  for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8);w[w.length-1]=l*8;
  let a=0x67452301,c=0xEFCDAB89,d=0x98BADCFE,e=0x10325476,f=0xC3D2E1F0;const x=new Uint32Array(80);
  const R=(v,n)=>(v<<n)|(v>>>(32-n));
  for(let i=0;i<w.length;i+=16){
    let A=a,B=c,C=d,D=e,E=f;

/* ============ terminal UI ============ */
function Terminal(cfg,onChange){
  const sim=new Sim();
  const root=h(`<div></div>`);
  const hist=[];let hp=0;
  const term=h(`<div class="term" aria-label="অনুশীলনের টার্মিনাল">
    <div class="term-bar"><i></i><i></i><i></i><span>অনুশীলনের টার্মিনাল</span><button type="button" class="reset">আবার শুরু</button></div>
    <div class="t-out" tabindex="0"></div>
    <div class="t-line"><label></label><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="কমান্ড লেখো" placeholder="এখানে কমান্ড লিখে Enter চাপো"></div>
  </div>`);
  const out=$('.t-out',term),inp=$('input',term),lab=$('label',term);
  root.append(term);
  const prompt=()=>`rafi@kathal:${sim.cwd.replace(sim.home,'~')}$`;
  const setPrompt=()=>{lab.textContent=prompt();const id='t'+cfg.id;inp.id=id;lab.htmlFor=id};
  const print=(t,c)=>{const s=document.createElement('span');if(c)s.className=c;s.textContent=t+'\n';if(c==='m')s.textContent=t;out.append(s)};
  const scroll=()=>{out.scrollTop=out.scrollHeight};
  function setup(){(cfg.setup||[]).forEach(l=>sim.exec(l))}
  setup();
  if(cfg.intro)print(cfg.intro,'m');
  setPrompt();
  function after(cmd,fly){onChange&&onChange(sim,cmd,sim.ok,fly);scroll();setPrompt()}
  function run(line){
    print(prompt()+' ','pr');out.lastChild.textContent=prompt()+' ';
    const e=document.createElement('span');e.textContent=line+'\n';out.append(e);
    if(line.trim()){hist.push(line);hp=hist.length}
    const r=sim.exec(line);
    if(r.clear)out.textContent='';
    r.out.forEach(o=>print(o.t,o.c));
    const fly=sim.fly;
    if(r.editor)return openEditor(r.editor,line,fly);
    after(line,fly);
  }
  function openEditor(ed,line){
    const box=h(`<div class="editor">
      <div class="ehead"></div>
      <textarea spellcheck="false" aria-label="ফাইল এডিটর"></textarea>
      <div class="ehelp"></div>
      <div class="ebar"></div></div>`);
    const ta=$('textarea',box),hd=$('.ehead',box),help=$('.ehelp',box),bar=$('.ebar',box);
    ta.value=ed.init;hd.textContent=(ed.kind==='vim'?'VIM  ':'GNU nano 7.2  ')+ed.name;
    let mode='normal';
    const close=(save)=>{
      box.remove();
      let extra=null;
      if(save)extra=ed.onSave(ta.value&&!ta.value.endsWith('\n')?ta.value+'\n':ta.value);
      if(ed.commit&&!save)print('Aborting commit due to empty commit message.','r');
      if(Array.isArray(extra))extra.forEach(o=>print(o.t,o.c));
      const fly=sim.fly;after(line,fly);inp.focus();
    };
    if(ed.kind==='vim'){
      bar.innerHTML=`<span class="mode"></span><button type="button" data-a="i">i</button><button type="button" data-a="esc">Esc</button><span>:</span><input aria-label="vim কমান্ড" placeholder="wq"><button type="button" data-a="wq">:wq সেভ</button><button type="button" data-a="q">:q! বাদ</button>`;
      help.textContent='ধাপ: i চাপো (লেখার মোড), লেখো, Esc চাপো, তারপর :wq লিখে Enter। ক্লাসের মতো :x দিলেও সেভ হবে।';
      const ml=$('.mode',bar),cl=$('input',bar);
      const set=(m)=>{mode=m;ml.textContent=m==='insert'?'-- INSERT --':'NORMAL';ta.readOnly=m!=='insert';ta.classList.toggle('normal',m!=='insert')};
      set('normal');
      const cmdRun=(v)=>{v=v.replace(/^:/,'').trim();if(v==='wq'||v==='x'||v==='w'){close(true)}else if(v==='q!'||v==='q'){close(false)}else{cl.value='';help.textContent=`"${v}" চেনা গেল না। সেভ করতে wq, বাদ দিতে q! লেখো।`}};
      ta.addEventListener('keydown',e=>{
        if(e.key==='Escape'){e.preventDefault();set('normal');return}
        if(mode==='normal'){
          if(e.key==='i'||e.key==='a'||e.key==='o'){e.preventDefault();set('insert');if(e.key==='o'){ta.setRangeText('\n',ta.selectionEnd,ta.selectionEnd,'end')}}
          else if(e.key===':'){e.preventDefault();cl.focus()}
          else if(!e.ctrlKey&&!e.metaKey&&e.key.length===1)e.preventDefault();
        }
      });
      cl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cmdRun(cl.value)}if(e.key==='Escape'){cl.value='';ta.focus()}});
      bar.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;if(a==='i'){set('insert');ta.focus()}if(a==='esc'){set('normal');ta.focus()}if(a==='wq')close(true);if(a==='q')close(false)});
    }else{
      bar.innerHTML=`<button type="button" data-a="s">^X সেভ করে বের হও</button><button type="button" data-a="c">বাদ দাও</button>`;
      help.textContent=ed.commit?'# চিহ্ন ছাড়া একটা লাইনে commit message লেখো। তারপর Ctrl+X, অথবা নিচের বোতাম।':'লেখো। তারপর Ctrl+X, অথবা নিচের বোতাম।';
      ta.addEventListener('keydown',e=>{if(e.ctrlKey&&(e.key==='x'||e.key==='X')){e.preventDefault();close(true)}});
      bar.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==='s')close(true);if(a==='c')close(false)});
      if(ed.commit){ta.setSelectionRange(0,0)}
    }
    term.append(box);ta.focus();
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value;inp.value='';run(v);return}
    if(e.key==='ArrowUp'){e.preventDefault();if(hp>0){hp--;inp.value=hist[hp]}return}
    if(e.key==='ArrowDown'){e.preventDefault();if(hp<hist.length-1){hp++;inp.value=hist[hp]}else{hp=hist.length;inp.value=''}return}
    if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.textContent='';return}
    if(e.key==='Tab'){
      e.preventDefault();const parts=inp.value.split(' '),last=parts[parts.length-1];
      const slash=last.lastIndexOf('/'),dir=slash>=0?last.slice(0,slash+1):'',pre=last.slice(slash+1),base=sim.norm(dir||'.');
      const m=(sim.isDir(base)?sim.kids(base):[]).filter(x=>x.startsWith(pre));
      if(m.length===1&&parts.length>1){parts[parts.length-1]=dir+m[0]+(sim.isDir(base+'/'+m[0])?'/':'');inp.value=parts.join(' ')}
    }
  });
  term.addEventListener('click',e=>{if(!window.getSelection().toString()&&!e.target.closest('button,.editor'))inp.focus()});
  $('.reset',term).addEventListener('click',()=>{cfg.onReset&&cfg.onReset()});
  return {el:root,sim,type(v){inp.value=v;inp.focus()},run};
}

/* ============ zones + graph (live picture of the repo) ============ */
function zonesView(){
  const w=h(`<div class="zones-wrap">
    <div class="zones">
      <div class="zone z1"><h5>Working Directory</h5><small>কাজের টেবিল</small><div class="zc"></div></div>
      <div class="zone z2"><h5>Staging Area</h5><small>ছবির লাইন</small><div class="zc"></div></div>
      <div class="zone z3"><h5>Local Repo</h5><small>নিজের অ্যালবাম</small><div class="zc"></div></div>
      <div class="zone z4"><h5>Remote Repo</h5><small>GitHub-এর অ্যালবাম</small><div class="zc"></div></div>
    </div></div>`);
  const zs=[...w.querySelectorAll('.zc')];zs.forEach(z=>{z.style.cssText='display:grid;gap:3px;min-width:0'});
  const chip=(t,c)=>`<div class="fc ${c||''}">${esc(t)}</div>`;
  return {el:w,render(sim){
    const r=sim.repo;
    if(!r){zs[0].innerHTML=sim.kids(sim.cwd).filter(x=>!x.startsWith('.')).map(x=>chip(x)).join('')||'<small>খালি</small>';zs[1].innerHTML=zs[2].innerHTML=zs[3].innerHTML='<small>git init হয়নি</small>';return}
    const s=sim.status(r),wt=sim.wt(r);

function graphSvg(sim){
  const r=sim.repo;if(!r)return '';
  const set=new Set();Object.values(r.refs).forEach(s=>sim.anc(s).forEach(x=>set.add(x)));
  const l=[...set].map(x=>sim.commits[x]).sort((a,b)=>a.n-b.n);if(!l.length)return '<svg width="300" height="30"><text x="6" y="19">এখনো কোনো commit নেই</text></svg>';
  const lanes=[];l.forEach(c=>{if(!lanes.includes(c.lane))lanes.push(c.lane)});
  const pos={};l.forEach((c,i)=>pos[c.sha]={x:34+i*92,y:30+lanes.indexOf(c.lane)*66});
  const colors=['var(--teal)','var(--pink)','var(--orange)','var(--good)','var(--sun)'];
  const W=Math.max(360,70+l.length*92+50),H=46+lanes.length*66;let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="branch আর commit-এর ছবি">`;
  l.forEach(c=>c.parents.forEach(p=>{if(pos[p]){const a=pos[p],b=pos[c.sha];s+=`<path d="M${a.x} ${a.y} C${a.x+45} ${a.y},${b.x-45} ${b.y},${b.x} ${b.y}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`}}));
  l.forEach(c=>{const p=pos[c.sha];s+=`<circle cx="${p.x}" cy="${p.y}" r="10" fill="${colors[lanes.indexOf(c.lane)%5]}" stroke="var(--ink)" stroke-width="2.5"/><text x="${p.x-24}" y="${p.y+24}">${c.sha.slice(0,7)}</text>`});
  const tags={};Object.entries(r.refs).forEach(([b,x])=>{(tags[x]=tags[x]||[]).push(b)});
  Object.entries(tags).forEach(([x,bs])=>{if(!pos[x])return;const p=pos[x];const t=bs.map(b=>b===r.head?'HEAD→'+b:b).join(', ');s+=`<text x="${p.x-14}" y="${p.y-14}" style="font-weight:700;fill:var(--pink)">${esc(t)}</text>`});
  return s+'</svg>';
}

  };

}

      <p class="lead">Git &amp; GitHub ক্লাস ৩-এর পুরো ১ ঘণ্টা ৫০ মিনিট, গল্পে আর হাতে-কলমে। রাফির তৃতীয় সপ্তাহ: ভুল করলে ফেরার সব রাস্তা (amend, reset, revert, stash), conflict পড়া, আর feature থেকে production পর্যন্ত release-এর পথ।</p>
      <div class="how"><span>গল্প</span><i>→</i><span>কেন শিখব</span><i>→</i><span>কোথায় লাগে</span><i>→</i><span>কমান্ড</span><i>→</i><span>নিজে চালাও</span><i>→</i><span>কুইজ</span></div>
      <button type="button" class="cta" id="startBtn">প্রথম অধ্যায় শুরু করো</button>
    </section>
    <div class="zig"></div>
    <section class="block"><h2>কী কী শিখবে</h2><p>পাশের সময়গুলো ভিডিওর আনুমানিক সময়। শেখার সুবিধার জন্য কিছু অংশ একসাথে এনেছি, তাই একটা অধ্যায়ে কখনো দুটো সময় আছে।</p>
      <div class="route" id="route"></div></section>
    <section class="block"><h2>সব কমান্ড এক জায়গায়</h2><p>ডান পাশের নম্বর হলো অধ্যায়। সারিতে চাপলে সেখানে চলে যাবে। আগের কমান্ডগুলো <a href="https://asad6426.github.io/git-golpo/class-1/" target="_blank" rel="noopener">ক্লাস ১</a> ও <a href="https://asad6426.github.io/git-golpo/class-2/" target="_blank" rel="noopener">ক্লাস ২</a>-এ আছে।</p>
      <div class="tbl"><table><thead><tr><th>কমান্ড</th><th>কী করে</th><th>অধ্যায়</th></tr></thead><tbody id="ctable"></tbody></table></div></section>
    <section class="block"><h2>ক্লাসটা কীভাবে পড়ানো হয়েছে</h2><p>শিক্ষক Md. Sanaullah Asif-এর এই ক্লাসের ধরন। এই পাতাও একই ছন্দে সাজানো।</p>
      <div class="style-list">
        <div><b>স্লাইড থেকে সরাসরি টার্মিনালে</b>একই second-class repo ধরে undo-এর প্রতিটা কমান্ড লাইভ চালিয়েছেন।</div>
        <div><b>ভুল থেকে ব্যাখ্যা</b>"Updated 0 paths", git stash-এর error, "No local changes": লাইভ ফল ধরেই বুঝিয়েছেন।</div>
        <div><b>ইচ্ছাকৃত বাজে লেখা</b>README-তে হিজিবিজি লিখে দেখিয়েছেন কোন কমান্ডে কোথা থেকে ফেরা যায়।</div>
        <div><b>ডকুমেন্ট পড়ে দেখানো</b>.gitignore-এর নিয়ম git-scm-এর পাতা খুলে উদাহরণসহ দেখিয়েছেন।</div>
        <div><b>পরের deck থেকে আগাম</b>Class 4 ও 5-এর স্লাইড খুলে merge-এর ধরন আর release workflow দেখিয়েছেন।</div>
        <div><b>বাস্তব প্রসঙ্গ</b>staging, production, deployment ধরে বুঝিয়েছেন কেন এত branch।</div>
      </div></section>
    <section class="block"><h2>কোথা থেকে নেওয়া, আর কী বাদ</h2>
      <p class="note" id="srcNote">কমান্ড ও স্লাইডের তথ্য ভিডিওর স্ক্রিন থেকে নেওয়া (প্রতি ৩০ সেকেন্ডের ছবি)। শিক্ষকের কথা এসেছে Meet ক্যাপশন থেকে, যা টুকরো টুকরো; তাই ব্যাখ্যা ও প্রশ্নোত্তর এখানে পুরো নেই। প্রায় ৯৪ মিনিটের পর স্ক্রিনে স্লাইড ছিল না, তাই শেষের আলোচনা এখানে প্রায় নেই। গল্প, চরিত্র (রাফি, তন্বী, জামিল, কাঁঠাল টেক) আর উদাহরণ বানানো। "ক্লাসের বাইরের" বলে দাগানো কথা ক্লাসে ছিল না। এখানকার টার্মিনাল একটা সিমুলেটর, আসল Git না, তাই নিজের মেশিনেও একবার চালিয়ে দেখবে। reset --hard আসল repo-তে সাবধানে।</p>
    </section></div>`);
  $('#startBtn',m).onclick=()=>{location.hash=CH[0].id};
  const rt=$('#route',m);
  CH.forEach((c,i)=>{
    const b=h(`<button type="button" class="rt ${done[c.id]?'done':''}"><span class="n">${done[c.id]?'✓':bn(i)}</span><span><b>${esc(c.title)}</b><small>${esc(c.topic)}</small>${chips(c.cmds)}</span><span class="ts">${esc(c.time)}</span></button>`);
    b.onclick=()=>{location.hash=c.id};rt.append(b);
  });
  const tb=$('#ctable',m);
  TABLE.forEach(([g,rows])=>{
    tb.append(h(`<table><tr class="grp"><td colspan="3">${g}</td></tr></table>`).querySelector('tr'));
    rows.forEach(([c,d,n])=>{const tr=h(`<table><tr style="cursor:pointer"><td><code>${esc(c)}</code></td><td>${esc(d)}</td><td>${bn(n)}</td></tr></table>`).querySelector('tr');tr.onclick=()=>{location.hash=CH[n].id};tb.append(tr)});
  });
  return m;
}
function checkDone(c,st){
  if(st.quiz.size>=c.quiz.length&&(!c.term||st.mi>=c.term.missions.length)){
    if(!done[c.id]){done[c.id]=1;store.set('git-golpo3-done',done);renderTop(c.id)}
  }
}
function buildChapter(c,idx){
  const st={mi:0,quiz:new Set()};
  const e=h(`<article>
    <div class="chap-head"><div class="eyebrow">অধ্যায় ${bn(idx)} · ভিডিওতে <span class="mono">${esc(c.time)}</span></div><h2>${esc(c.title)}</h2><p>${esc(c.topic)}</p></div>
    <div class="scene-slot"></div>
    <div class="part"><h3>কেন শিখব, কোথায় লাগবে</h3>
      <div class="duo"><div class="card pink"><h4>কেন শিখব</h4><p>${fmt(c.why)}</p></div><div class="card teal"><h4>বাস্তবে কোথায় লাগে</h4><p>${fmt(c.where)}</p></div></div></div>
  </article>`);
  $('.scene-slot',e).append(Scene(c.scene));
  const add=(n)=>e.append(n);
  if(c.cards){const p=h(`<div class="part"><h3>ক্লাসের মূল কথা</h3><div class="duo"></div></div>`);
    c.cards.forEach(k=>$('.duo',p).append(h(`<div class="card ${k.c||''}"><h4>${esc(k.t)}</h4>${k.html||`<ul>${k.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}</div>`)));add(p)}
  if(c.commands){const p=h(`<div class="part"><h3>কমান্ডগুলো</h3><div class="cmdlist">${c.commands.map(x=>`<div class="cmd"><code>${esc(x[0])}</code><span>${esc(x[1])}</span></div>`).join('')}</div></div>`);add(p)}
  if(c.note)add(h(`<p class="note">${esc(c.note)}</p>`));
  if(c.widget){const p=h(`<div class="part"><h3>${esc(c.widgetTitle)}</h3></div>`);p.append(W[c.widget]());add(p)}
  if(c.tip)add(h(`<p class="note">${esc(c.tip)}</p>`));
  if(c.term)add(buildLab(c,st));
  const qz=h(`<div class="part"><h3>নিজেকে যাচাই করো</h3><div class="quiz"></div></div>`);
  c.quiz.forEach((q,qi)=>{
    const d=h(`<div class="q"><p>${fmt(q.q)}</p><div class="opts">${q.o.map((o,i)=>`<button type="button" class="opt" data-i="${i}">${fmt(o)}</button>`).join('')}</div></div>`);
    d.addEventListener('click',ev=>{
      const b=ev.target.closest('.opt');if(!b||b.disabled)return;
      const i=+b.dataset.i;
      if(i===q.a){b.classList.add('yes');d.querySelectorAll('.opt').forEach(x=>x.disabled=true);d.append(h(`<p class="exp" style="font-weight:400">ঠিক! ${fmt(q.e)}</p>`));st.quiz.add(qi);checkDone(c,st)}
      else{b.classList.add('no');b.disabled=true}
    });
    $('.quiz',qz).append(d);
  });
  add(qz);
  const nav=h(`<nav class="foot-nav"></nav>`);
  const prev=CH[idx-1],next=CH[idx+1];
  nav.innerHTML=(prev?`<button type="button" class="btn" data-go="${prev.id}">আগের: ${esc(prev.title)}</button>`:`<button type="button" class="btn" data-go="summary">সারসংক্ষেপে ফেরো</button>`)+(next?`<button type="button" class="cta" data-go="${next.id}">পরের: ${esc(next.title)}</button>`:`<button type="button" class="cta" data-go="summary">সারসংক্ষেপে ফেরো</button>`);
  nav.addEventListener('click',ev=>{const b=ev.target.closest('[data-go]');if(b)location.hash=b.dataset.go});
  add(nav);
  return e;
}
function buildLab(c,st){
  const t=c.term;const p=h(`<div class="part"><h3>এবার নিজে চালাও</h3><div class="labslot"></div></div>`);
  const slot=$('.labslot',p);
  function mount(){
    slot.innerHTML='';st.mi=0;
    const lab=h(`<div class="lab"><div class="lab-left" style="display:grid;gap:8px;min-width:0"></div><div class="miss"><h4>কাজের তালিকা</h4><ol></ol><div class="win" hidden>সব কাজ শেষ! এবার কুইজটা করো।</div></div></div>`);
    const ol=$('ol',lab);
    const lis=t.missions.map((m,i)=>{
      const li=h(`<li><span class="tick">${bn(i+1)}</span><div><span>${esc(m[0])}</span><button type="button" class="hintbtn" hidden>হিন্ট দেখাও</button></div></li>`);
      ol.append(li);return li;
    });
    const zv=t.zones?zonesView():null;const gr=t.graph?h(`<div class="graph"></div>`):null;
    let term;
    const refresh=(sim)=>{if(zv)zv.render(sim);if(gr)gr.innerHTML=graphSvg(sim)};
    const mark=()=>{
      lis.forEach((li,i)=>{li.classList.toggle('ok',i<st.mi);li.classList.toggle('cur',i===st.mi);
        const hb=$('.hintbtn',li);hb.hidden=i!==st.mi;if(i<st.mi)$('.tick',li).textContent='✓';});
      $('.win',lab).hidden=st.mi<t.missions.length;
    };
    const onCh=(sim,cmd,ok,fly)=>{
      refresh(sim);if(zv&&fly&&fly.length)zv.flyAnim(fly);
      const line=cmd.trim();
      for(let g=0;g<4&&st.mi<t.missions.length;g++){
        const m=t.missions[st.mi],chk=m[2];let pass=false;
        if(chk instanceof RegExp){pass=g===0&&ok&&line.split(/\s*&&\s*/).some(x=>chk.test(x))}
        else pass=!!chk(sim,line);
        if(pass){st.mi++;}else break;
      }
      mark();checkDone(c,st);
    };
    term=Terminal({id:c.id,setup:t.setup,intro:t.intro,onReset:mount},onCh);
    lis.forEach((li,i)=>{$('.hintbtn',li).onclick=function(){
      const b=h(`<button type="button" class="hintcmd" title="টার্মিনালে বসাও">${esc(t.missions[i][1])}</button>`);
      b.onclick=()=>term.type(t.missions[i][1]);this.replaceWith(b)}});
    const left=$('.lab-left',lab);left.append(term.el);if(zv)left.append(zv.el);if(gr)left.append(gr);
    refresh(term.sim);mark();slot.append(lab);
  }
  mount();return p;
}
function route(){
  let id=location.hash.replace('#','');
  const idx=CH.findIndex(c=>c.id===id);
  view.textContent='';
  if(idx<0){view.append(renderMap());renderTop('');window.scrollTo(0,0);return}
  const c=CH[idx];
  if(!chEls[id])chEls[id]=buildChapter(c,idx);
  view.append(chEls[id]);renderTop(id);window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
